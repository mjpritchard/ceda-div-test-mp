# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
site_url: https://mjpritchard.github.io/ceda-div-test-mp

backend:
  name: github
  repo: mjpritchard/ceda-div-test-mp
  auth_methods: [token]

media_folder: /assets/img
public_folder: /img
publish_mode: editorial_workflow

collections:
  - name: posts
    label: Posts
    folder: /content/posts
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: richtext }

  - name: news
    label: News
    folder: /content/news/updates/2026
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Thumbnail, name: thumbnail, widget: image }
      - { label: Icon, name: icon, widget: string }
      - { label: Body, name: body, widget: richtext }
      - name: tags
        label: Tags
        widget: select
        multiple: true
        options:
          - { label: "ceda", value: "ceda" }
          - { label: "jasmin", value: "jasmin" }
          - { label: "data incident", value : "data-incident-nov25" }
